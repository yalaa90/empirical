<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img">
  <title>Field &amp; Form Blue Key Clip Accessory</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fafaf9"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fabric" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="48%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="fabricSoft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#292524" flood-opacity=".2"/>
    </filter>
    <pattern id="weave" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7H14M7 0V14" stroke="#1c1917" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="corduroy" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M3 0V14M10 0V14" stroke="#1c1917" stroke-opacity=".14" stroke-width="2.5"/>
      <path d="M3 0V14M10 0V14" stroke="#ffffff" stroke-opacity=".14" stroke-width="1"/>
    </pattern>
    <pattern id="knit" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M2 0V12M6 0V12M10 0V12" stroke="#1c1917" stroke-opacity=".12" stroke-width="1.5"/>
    </pattern>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#1c1917" fill-opacity=".13"/>
      <circle cx="9" cy="9" r="1.1" fill="#1c1917" fill-opacity=".13"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
  <circle cx="530" cy="220" r="198" fill="#1d4ed8" opacity=".07"/>
  <circle cx="270" cy="880" r="140" fill="#2563eb" opacity=".12"/>
  <path d="M0 820 Q400 790 800 820 L800 1000 L0 1000 Z" fill="#ffffff" opacity=".2"/>
  <ellipse cx="400" cy="832" rx="208" ry="34" fill="#292524" opacity=".12" filter="url(#blur)"/>
  <g transform="rotate(-1.6 400 540)"><g filter="url(#softShadow)">
    <path d="M400 268 C330 268 300 318 300 368 C300 428 340 458 400 458 C430 458 450 448 460 428" fill="none" stroke="#1d4ed8" stroke-width="38" stroke-linecap="round"/>
    <path d="M400 268 C330 268 300 318 300 368 C300 428 340 458 400 458 C430 458 450 448 460 428" fill="none" stroke="#2563eb" stroke-width="9" stroke-linecap="round" stroke-opacity=".42"/>
    <circle cx="400" cy="552" r="106" fill="none" stroke="#1e3a8a" stroke-width="30"/>
    <circle cx="400" cy="552" r="106" fill="none" stroke="#2563eb" stroke-width="6" stroke-opacity=".32"/>
    <path d="M400 446 V460" stroke="#1e3a8a" stroke-width="22"/>
    <g transform="rotate(-16 400 646)">
      <rect x="370" y="620" width="60" height="156" rx="18" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="4"/>
      <circle cx="400" cy="650" r="16" fill="#1e3a8a" opacity=".4"/>
      <path d="M430 700 H462 V720 H430 M430 738 H454 V758 H430" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="4"/>
    </g>
    <g transform="rotate(18 470 676)">
      <rect x="444" y="646" width="52" height="134" rx="16" fill="#2563eb" stroke="#1e3a8a" stroke-width="4"/>
      <circle cx="470" cy="674" r="14" fill="#1e3a8a" opacity=".35"/>
      <path d="M496 718 H520 V736 H496 M496 752 H512 V770 H496" fill="#2563eb" stroke="#1e3a8a" stroke-width="4"/>
    </g>
    <path d="M362 330 Q400 300 438 330" fill="none" stroke="#bfdbfe" stroke-width="5" stroke-opacity=".45"/>
  </g></g>
</svg>
